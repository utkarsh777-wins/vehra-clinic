<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="mt">
  <title id="mt">Schematic map of the Banga Road area in Phagwara, not to scale. The clinic location is fictional.</title>
  <rect width="800" height="560" fill="#EDE6D9"/>
  <g fill="#E4DCCB">
    <rect x="40" y="40" width="150" height="110" rx="10"/><rect x="220" y="30" width="130" height="90" rx="10"/><rect x="560" y="40" width="190" height="120" rx="10"/>
    <rect x="60" y="330" width="170" height="160" rx="10"/><rect x="470" y="330" width="130" height="90" rx="10"/><rect x="630" y="340" width="140" height="170" rx="10"/>
    <rect x="290" y="390" width="140" height="120" rx="10"/>
  </g>
  <path d="M600 440h90v60h-90z" fill="#D7E3D6"/><text x="645" y="476" font-family="Instrument Sans, sans-serif" font-size="12" fill="#5C6B5F" text-anchor="middle">Park</text>
  <!-- minor streets -->
  <g stroke="#FBF8F2" stroke-width="10" stroke-linecap="round" fill="none">
    <path d="M210 20v520"/><path d="M450 120v420"/><path d="M20 310h420"/><path d="M540 300 780 320"/><path d="M620 170v360"/><path d="M260 170 330 380"/>
  </g>
  <!-- railway -->
  <path d="M-10 190 810 130" stroke="#9A988F" stroke-width="3" fill="none"/>
  <path d="M-10 190 810 130" stroke="#EDE6D9" stroke-width="1.5" stroke-dasharray="8 8" fill="none"/>
  <!-- GT Road -->
  <path d="M90 -10 360 570" stroke="#FFFFFF" stroke-width="30" fill="none"/>
  <path d="M90 -10 360 570" stroke="#D9CDB5" stroke-width="1" fill="none"/>
  <!-- Banga Road -->
  <path d="M245 280C380 250 520 250 810 232" stroke="#FFFFFF" stroke-width="22" fill="none"/>
  <g font-family="Instrument Sans, sans-serif" font-weight="600" fill="#5A5E57">
    <text x="0" y="0" font-size="13" transform="translate(150 120) rotate(65)" letter-spacing=".04em">GT ROAD · NH 44</text>
    <text x="560" y="230" font-size="13" letter-spacing=".04em" transform="rotate(-2.5 560 230)">BANGA ROAD →</text>
    <text x="560" y="128" font-size="11" letter-spacing=".04em" fill="#7A7870" transform="rotate(-4.2 560 128)">RAILWAY LINE</text>
    <text x="122" y="30" font-size="11" fill="#7A7870" letter-spacing=".04em">↑ TO JALANDHAR</text>
  </g>
</svg>
